name: accessible_flutter_tts
description: Drop-in replacement for flutter_tts that waits for VoiceOver or TalkBack to finish and speaks at the screen reader's speed.
version: 4.2.5+ezymob.1
homepage: https://github.com/BLKKKBVSIK/flutter_tts

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: fr.ezymob.accessiblefluttertts
        pluginClass: AccessibleFlutterTtsPlugin
      ios:
        pluginClass: AccessibleFlutterTtsPlugin
      macos:
        pluginClass: AccessibleFlutterTtsPlugin
      windows:
        pluginClass: AccessibleFlutterTtsPlugin
        supportedVariants:
          - uwp
          - win32
      web:
        pluginClass: AccessibleFlutterTtsPlugin
        fileName: flutter_tts_web.dart

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=1.22.0"
dev_dependencies:
  lints: ^3.0.0
